# Tick table (upper bound exclusive, tick). Last bound .inf.
# verified 2026-11-22 against the KRX 2023 tick-size revision (research/journal/2026-11-22.md)
market: kr
currency: KRW
sell_tax_rate: {stock: 0.0020, etf: 0.0}
tick_table:
  stock: [[2000, 1], [5000, 5], [20000, 10], [50000, 50], [200000, 100], [500000, 500], [.inf, 1000]]
  etf: [[2000, 1], [.inf, 5]]
slippage_ticks: 1
max_tick_cost_pct: 0.001
always_include: ["069500", "102110"]
session_open: "09:00"
session_close: "15:30"
closing_auction_start: "15:20"
# per-day sessions (Jan-2 10:00 opens, exam days 10:00-16:30) from exchange_calendars
exchange_calendar: XKRX
# days exchange_calendars 4.13.3 gets wrong, local "HH:MM" open / close:
# 2026-11-19 = 2027 CSAT exam day (KRX: opens 10:00, closes 16:30); confirmed 2026-11-24 in the
# stored 069500 minute bars (first bar ends 10:01, auction bar 16:30); the package has 09:00-15:30
session_overrides:
  2026-11-19: ["10:00", "16:30"]
exclude_name_keywords: ["레버리지", "인버스", "2X", "스팩"]
delisted_supplement: true
fractional_orders: false
# validate recommends a rule only if its valid-period return beats buying and holding this
benchmark: "069500"    # KODEX 200
minute_start: 2022-11-23
vi: {static_pct: 0.10, dynamic_pct_kospi200: 0.03, dynamic_pct_other: 0.06, halt_minutes: 2, etf_exempt: true}
# LAB ASSUMPTION, not from the paper: KR counterpart of the US $0.50 ATR floor (ATR14 > 1% of prior close)
orb_min_atr_pct: 0.01
