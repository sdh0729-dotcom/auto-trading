[project]
name = "autotrade"
version = "0.1.0"
description = "Auto-trading research lab"
requires-python = "==3.12.*"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "httpx",
    "pyyaml",
    "typer",
    "scipy",
    "nautilus_trader==1.231.*",
    "pykrx",
    "python-dotenv",
    "setuptools<81",  # pykrx imports pkg_resources
]

[project.optional-dependencies]
kronos = ["torch", "huggingface_hub", "einops", "safetensors", "tqdm"]

[dependency-groups]
dev = ["pytest", "respx"]

[project.scripts]
lab = "autotrade.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: timing/size checks (run by default; deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
